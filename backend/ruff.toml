line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["B008"]  # typer/fastapi use function calls in argument defaults

[lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"src/tokenpulse/db/migrations/*" = ["E501", "I001"]
"src/tokenpulse/db/models.py" = ["E501"]  # SQLAlchemy declarative columns read better unwrapped

[lint.isort]
known-first-party = ["tokenpulse"]
