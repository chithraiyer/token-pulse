# Alembic config for manual use (`uv run alembic ...`) from the backend/ directory.
# At runtime the app configures script_location and sqlalchemy.url programmatically
# (tokenpulse.db.session.ensure_schema), so the URL here is only a dev convenience.
[alembic]
script_location = src/tokenpulse/db/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite:///tokenpulse.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
