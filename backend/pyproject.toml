[project]
name = "tokenpulse"
version = "0.1.0"
description = "Claude Code cost & usage monitor — ingest, trend, spike-detect, recommend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.27",
    "typer>=0.15",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.scripts]
tokenpulse = "tokenpulse.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["tokenpulse.core"]
branch = true

[tool.coverage.report]
# Constitution Principle III: money-path logic in tokenpulse.core must stay well covered.
fail_under = 90
show_missing = true
